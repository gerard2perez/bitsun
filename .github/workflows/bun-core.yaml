# 2026-10-18
name: Bun Core Image

on:
  schedule:
    - cron: '0 4 * * *'

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: bun-core
  cancel-in-progress: false

jobs:
  bun-core:
    name: Build Bun Core Image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    outputs:
      image_changed: ${{ steps.check_base.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # =========================================================
      # CHECK BUN BASE IMAGE
      # =========================================================

      - name: Get Bun base image digest
        id: bun_base
        run: |
          set -euo pipefail

          API_URL="https://hub.docker.com/v2/repositories/oven/bun/tags/1-slim"

          DIGEST=$(curl -fsSL "$API_URL" | jq -r '.digest')

          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
            echo "Failed to retrieve Bun base image digest"
            exit 1
          fi

          echo "Bun base image digest: $DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Restore digest cache
        id: cache_digest
        uses: actions/cache@v6
        with:
          path: /tmp/bun-slim-digest
          key: bun-digest-${{ runner.os }}-${{ steps.bun_base.outputs.digest }}

      - name: Check base image
        id: check_base
        run: |
          if [ "${{ steps.cache_digest.outputs.cache-hit }}" = "true" ]; then
            echo "Bun base image has not changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bun base image has changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "Cache hit: ${{ steps.cache_digest.outputs.cache-hit }}"
          echo "Digest: ${{ steps.bun_base.outputs.digest }}"

      # =========================================================
      # GET BUN VERSION
      # =========================================================

      - name: Get Bun version
        if: steps.check_base.outputs.changed == 'true'
        id: bun_version
        run: |
          set -euo pipefail

          VERSION=$(docker run --rm oven/bun:1-slim bun --version)

          if [ -z "$VERSION" ]; then
            echo "Failed to determine Bun version"
            exit 1
          fi

          echo "Bun version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # =========================================================
      # BUILD
      # =========================================================

      - name: Set up Docker Buildx
        if: steps.check_base.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.check_base.outputs.changed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Bun Core image
        if: steps.check_base.outputs.changed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bun-core:${{ steps.bun_version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/bun-core:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
