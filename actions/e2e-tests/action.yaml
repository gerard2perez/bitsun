name: E2E Tests

description: Run Playwright E2E tests against built services

inputs:
  services:
    description: JSON array of services
    required: true
  vps-host:
    description: Hostname of the VPS to upload reports
    required: true
  vps-user:
    description: Username for the VPS
    required: true
  vps-ssh-key:
    description: SSH private key for the VPS
    required: true

outputs:
  summary:
    description: Summary of the E2E test results
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Download release metadata
      uses: actions/download-artifact@v8
      with:
        pattern: release-*
        path: release-metadata
        merge-multiple: true

    - name: Load E2E image configuration
      env:
        APPLICATIONS: ${{ inputs.services }}
      shell: bash
      run: |
        set -euo pipefail
        while IFS=$'\t' read -r name image_env; do
          source "release-metadata/${name}.env"
          echo "${image_env}=${IMAGE}" >> "$GITHUB_ENV"
          echo "${image_env}=${IMAGE}"
        done < <(jq -r '.[] | [.name, .image_env] | @tsv' <<< "$APPLICATIONS")

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - uses: gerard2perez/bitsun/actions/setup-bun-env@main

    - name: Restore Playwright browsers
      id: playwright-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install dependencies and Playwright browsers
      shell: bash
      run: |
        bun install --frozen-lockfile
        bunx playwright install --with-deps

    - name: Save Playwright browsers
      if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

    - name: Prepare Docker Env
      shell: bash
      run: |
        echo "127.0.0.1 bakery.local" | sudo tee -a /etc/hosts
        bun run infra:e2e
        echo "=== Compose E2E ==="
        cat compose.e2e.yaml
        echo "=== Traefik Providers ==="
        cat traefik-providers.e2e.yaml
        echo "=== ENV ==="
        cat .env.e2e-compose

    - name: Docker Start
      shell: bash
      run: |
        set -eu
        docker compose -f compose.e2e.yaml up -d
        sleep 15

    - name: Run E2E tests
      id: e2e-tests
      shell: bash
      run: PLAYWRIGHT_JSON_OUTPUT_NAME=results.json bunx playwright test --reporter=json,html,list

    - name: Upload E2E report
      if: always()
      uses: appleboy/scp-action@v1
      with:
        host: ${{ inputs.vps-host }}
        username: ${{ inputs.vps-user }}
        key: ${{ inputs.vps-ssh-key }}
        source: 'playwright-report/*'
        target: '/srv/projects/pw-yesjo/pr-${{ github.event.pull_request.number }}/${{ github.sha }}'
        strip_components: 1

    - name: Generate PR Report
      uses: daun/playwright-report-summary@v4
      if: always()
      id: summary
      with:
        report-file: results.json
        report-url: 'https://pw.stage.${{ env.HOSTNAME }}/pr-${{ github.event.pull_request.number }}/${{ github.sha }}'
        test-command: 'npx playwright test --'
        job-summary: true
        create-comment: false

    - uses: marocchino/sticky-pull-request-comment@v3
      with:
        message: ${{ steps.summary.outputs.summary }}
