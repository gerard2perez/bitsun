name: E2E Tests Preparation

description: Prepares Playwright E2E tests environment

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - uses: gerard2perez/bitsun/actions/setup-bun-env@main

    - name: Restore Playwright browsers
      id: playwright-cache
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - name: Install Playwright browsers and system dependencies
      shell: bash
      run: |
        bunx playwright install --with-deps

    - name: Save Playwright browsers
      if: success() && steps.playwright-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
