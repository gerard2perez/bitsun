# 2026-10-18
# .github/actions/setup-bun-env/action.yaml
name: Setup Bun Env
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - id: cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-
    - name: Warm cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
